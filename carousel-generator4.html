// ============================================================
//  Slide rendering to a canvas (used for both preview + export)
// ============================================================

function wrapText(ctx, text, maxWidth) {
  const words = text.split(" ");
  const lines = [];
  let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

// Draw a slide onto a canvas at given scale. avatarImg is an HTMLImageElement (cropped already or full with crop params).
function drawSlide(canvas, slide, idx, total, avatarState, scale) {
  const W = 1080, H = 1350;
  canvas.width = W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  ctx.textBaseline = "top";

  // bg
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  if (slide.type && slide.type.indexOf("ed-") === 0) {
    drawEditorialSlide(ctx, slide, idx, total, avatarState, W, H);
    return;
  }
  if (slide.type === "card") {
    drawCardSlide(ctx, slide, avatarState, W, H);
    return;
  }

  const padX = 82, padTop = 72;

  // --- Avatar ---
  const avSize = 112;
  const avX = padX, avY = padTop;
  ctx.save();
  ctx.beginPath();
  ctx.arc(avX + avSize / 2, avY + avSize / 2, avSize / 2, 0, Math.PI * 2);
  ctx.closePath();
  ctx.clip();
  if (avatarState.img && avatarState.img.naturalWidth) {
    const im = avatarState.img;
    // cover-fit using crop state (zoom + offset normalized 0..1 center)
    const z = avatarState.zoom || 1;
    const natMin = Math.min(im.naturalWidth, im.naturalHeight);
    const srcSize = natMin / z;
    let sx = (im.naturalWidth - srcSize) * (avatarState.cx ?? 0.5);
    let sy = (im.naturalHeight - srcSize) * (avatarState.cy ?? 0);
    sx = Math.max(0, Math.min(sx, im.naturalWidth - srcSize));
    sy = Math.max(0, Math.min(sy, im.naturalHeight - srcSize));
    try { ctx.drawImage(im, sx, sy, srcSize, srcSize, avX, avY, avSize, avSize); } catch (e) {
      ctx.fillStyle = "#d8dde2"; ctx.fillRect(avX, avY, avSize, avSize);
    }
  } else {
    ctx.fillStyle = "#d8dde2";
    ctx.fillRect(avX, avY, avSize, avSize);
  }
  ctx.restore();
  // border
  ctx.beginPath();
  ctx.arc(avX + avSize / 2, avY + avSize / 2, avSize / 2, 0, Math.PI * 2);
  ctx.strokeStyle = C.avatarBorder;
  ctx.lineWidth = 2;
  ctx.stroke();

  // --- Name + handle ---
  const txtX = avX + avSize + 22;
  ctx.fillStyle = C.text;
  ctx.font = "800 42px InterEmbed, sans-serif";
  const nameY = avY + 18;
  ctx.fillText(NAME, txtX, nameY);
  const nameW = ctx.measureText(NAME).width;
  // verified badge
  const badge = 40;
  const bx = txtX + nameW + 9;
  const by = nameY + 1;
  drawBadge(ctx, bx, by, badge);
  // handle
  ctx.fillStyle = C.handle;
  ctx.font = "500 34px InterEmbed, sans-serif";
  ctx.fillText(HANDLE, txtX, nameY + 52);

  // --- Content area ---
  const contentTop = padTop + avSize + 56;
  const maxW = W - padX * 2;
  let y = contentTop + 20;

  if (slide.type === "cover") {
    ctx.font = "800 106px InterEmbed, sans-serif";
    const lh = 106 * 1.08;
    const full = slide.headlineBlack + " \u0000" + slide.headlineBlue; // marker for blue start
    // Build word list with color
    drawTwoColorBlock(ctx, slide.headlineBlack, slide.headlineBlue, padX, y, maxW, 106, 1.08, C.text, C.blue);
    // swipe cue
    ctx.fillStyle = C.swipe;
    ctx.font = "600 30px InterEmbed, sans-serif";
    const sw = "Swipe \u2192";
    const swW = ctx.measureText(sw).width;
    ctx.fillText(sw, W - padX - swW, H - 74 - 30);
  } else if (slide.type === "content") {
    ctx.fillStyle = C.text;
    ctx.font = "800 80px InterEmbed, sans-serif";
    let lines = wrapText(ctx, slide.headline, maxW);
    const hlh = 80 * 1.08;
    for (const l of lines) { ctx.fillText(l, padX, y); y += hlh; }
    y += 48 - (hlh - 80);
    // p1
    ctx.font = "450 52px InterEmbed, sans-serif";
    const blh = 52 * 1.38;
    for (const para of [slide.p1, slide.p2]) {
      if (!para) continue;
      const pls = wrapText(ctx, para, maxW);
      for (const l of pls) { ctx.fillText(l, padX, y); y += blh; }
      y += 30;
    }
    y += 6;
    // blue
    ctx.fillStyle = C.blue;
    ctx.font = "700 52px InterEmbed, sans-serif";
    const bls = wrapText(ctx, slide.blue, maxW);
    for (const l of bls) { ctx.fillText(l, padX, y); y += blh; }
  } else if (slide.type === "cta") {
    ctx.fillStyle = C.text;
    ctx.font = "800 88px InterEmbed, sans-serif";
    const clh = 88 * 1.08;
    const lines = wrapText(ctx, slide.closing, maxW);
    for (const l of lines) { ctx.fillText(l, padX, y); y += clh; }
    y += 48 - (clh - 88);
    ctx.fillStyle = C.blue;
    ctx.font = "800 80px InterEmbed, sans-serif";
    ctx.fillText(slide.handleBlue || HANDLE, padX, y);
  }

  // --- Progress dots ---
  const dotY = H - 72 - 12;
  const gap = 14;
  const dims = [];
  for (let i = 0; i < total; i++) dims.push(i === idx ? 32 : 12);
  const totalW = dims.reduce((a, b) => a + b, 0) + gap * (total - 1);
  let dx = (W - totalW) / 2;
  for (let i = 0; i < total; i++) {
    const w = dims[i];
    ctx.fillStyle = i === idx ? C.blue : C.inactiveDot;
    roundRect(ctx, dx, dotY, w, 12, 6);
    ctx.fill();
    dx += w + gap;
  }
}

// cache of loaded screenshot images keyed by url/dataurl
const SHOT_CACHE = {};
function getShotImage(src) {
  if (!src) return null;
  if (SHOT_CACHE[src] && SHOT_CACHE[src].complete) return SHOT_CACHE[src];
  return SHOT_CACHE[src] || null;
}

function drawAvatarCircle(ctx, avatarState, cx, cy, size) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx + size / 2, cy + size / 2, size / 2, 0, Math.PI * 2);
  ctx.closePath();
  ctx.clip();
  if (avatarState.img && avatarState.img.naturalWidth) {
    const im = avatarState.img;
    const z = avatarState.zoom || 1;
    const natMin = Math.min(im.naturalWidth, im.naturalHeight);
    const srcSize = natMin / z;
    let sx = (im.naturalWidth - srcSize) * (avatarState.cx ?? 0.5);
    let sy = (im.naturalHeight - srcSize) * (avatarState.cy ?? 0);
    sx = Math.max(0, Math.min(sx, im.naturalWidth - srcSize));
    sy = Math.max(0, Math.min(sy, im.naturalHeight - srcSize));
    try { ctx.drawImage(im, sx, sy, srcSize, srcSize, cx, cy, size, size); } catch (e) {}
  } else { ctx.fillStyle = "#d8dde2"; ctx.fillRect(cx, cy, size, size); }
  ctx.restore();
  ctx.beginPath();
  ctx.arc(cx + size / 2, cy + size / 2, size / 2, 0, Math.PI * 2);
  ctx.strokeStyle = C.avatarBorder; ctx.lineWidth = 2; ctx.stroke();
}

function drawDots(ctx, idx, total, W, H) {
  const dotY = H - 72 - 12, gap = 14;
  const dims = [];
  for (let i = 0; i < total; i++) dims.push(i === idx ? 32 : 12);
  const totalW = dims.reduce((a, b) => a + b, 0) + gap * (total - 1);
  let dx = (W - totalW) / 2;
  for (let i = 0; i < total; i++) {
    const w = dims[i];
    ctx.fillStyle = i === idx ? C.blue : C.inactiveDot;
    roundRect(ctx, dx, dotY, w, 12, 6); ctx.fill();
    dx += w + gap;
  }
}

// Card template: white tweet card floating centered on a soft solid background.
function drawCardSlide(ctx, slide, avatarState, W, H) {
  // background
  ctx.fillStyle = "#ECEEF0";
  ctx.fillRect(0, 0, W, H);

  const cardW = 840, padC = 64;
  const textMaxW = cardW - padC * 2;

  // measure text
  ctx.font = "500 52px InterEmbed, sans-serif";
  const lines = wrapText(ctx, slide.text || "", textMaxW);
  const textH = lines.length * 52 * 1.4;
  const headH = 96; // avatar block
  const cardH = padC + headH + 40 + textH + padC;
  const cx = (W - cardW) / 2;
  const cy = (H - cardH) / 2;

  // card with soft shadow
  ctx.save();
  ctx.shadowColor = "rgba(15,20,25,0.10)";
  ctx.shadowBlur = 60;
  ctx.shadowOffsetY = 18;
  ctx.fillStyle = "#FFFFFF";
  roundRect(ctx, cx, cy, cardW, cardH, 36);
  ctx.fill();
  ctx.restore();

  // header: avatar + name + handle
  const avSize = 96;
  drawAvatarCircle(ctx, avatarState, cx + padC, cy + padC, avSize);
  const tx = cx + padC + avSize + 20;
  ctx.fillStyle = C.text;
  ctx.font = "800 38px InterEmbed, sans-serif";
  ctx.fillText(NAME, tx, cy + padC + 12);
  const nameW = ctx.measureText(NAME).width;
  drawBadge(ctx, tx + nameW + 9, cy + padC + 14, 38);
  ctx.fillStyle = C.handle;
  ctx.font = "500 32px InterEmbed, sans-serif";
  ctx.fillText(HANDLE, tx, cy + padC + 58);

  // statement
  ctx.fillStyle = C.text;
  ctx.font = "500 52px InterEmbed, sans-serif";
  let y = cy + padC + headH + 40;
  for (const l of lines) { ctx.fillText(l, cx + padC, y); y += 52 * 1.4; }
}

function drawEdHeader(ctx, avatarState) {
  const padX = 82, padTop = 72, av = 84;
  drawAvatarCircle(ctx, avatarState, padX, padTop, av);
  const tx = padX + av + 18;
  ctx.fillStyle = C.text;
  ctx.font = "800 36px InterEmbed, sans-serif";
  ctx.fillText(NAME, tx, padTop + 12);
  const nameW = ctx.measureText(NAME).width;
  drawBadge(ctx, tx + nameW + 9, padTop + 14, 36);
  ctx.fillStyle = C.handle;
  ctx.font = "500 30px InterEmbed, sans-serif";
  ctx.fillText(HANDLE, tx, padTop + 56);
}

function drawEditorialSlide(ctx, slide, idx, total, avatarState, W, H) {
  const padX = 82;
  ctx.textBaseline = "top";

  if (slide.type === "ed-cover") {
    drawEdHeader(ctx, avatarState);
    const maxW = W - padX * 2;
    const t = ((slide.titleBlack || "") + " " + (slide.titleBlue || "")).trim();
    const fs = t.length > 60 ? 84 : t.length > 40 ? 100 : 128;
    let y = t.length > 60 ? 360 : 440;
    // lead
    ctx.fillStyle = C.text;
    ctx.font = "500 52px InterEmbed, sans-serif";
    const leadLines = wrapText(ctx, slide.lead || "", maxW);
    for (const l of leadLines) { ctx.fillText(l, padX, y); y += 52 * 1.2; }
    y += 28;
    // big title black + blue inline
    ctx.font = `800 ${fs}px InterEmbed, sans-serif`;
    drawTwoColorBlock(ctx, slide.titleBlack || "", slide.titleBlue || "", padX, y, maxW, fs, 1.05, C.text, C.blue);
    // swipe
    ctx.fillStyle = C.swipe; ctx.font = "600 30px InterEmbed, sans-serif";
    const sw = "Swipe \u2192"; const swW = ctx.measureText(sw).width;
    ctx.fillText(sw, W - padX - swW, H - 74 - 30);
    drawDots(ctx, idx, total, W, H);
    return;
  }

  if (slide.type === "ed-tool") {
    const padTop = 84;
    // number (left) + name (right) on same baseline
    ctx.fillStyle = C.text;
    ctx.font = "800 88px InterEmbed, sans-serif";
    ctx.fillText((slide.num || "") + ".", padX, padTop);
    // name right-aligned, may wrap to 2 lines
    const nameMaxW = 660;
    const nameLines = wrapText(ctx, slide.name || "", nameMaxW);
    let ny = padTop;
    for (const l of nameLines) {
      const lw = ctx.measureText(l).width;
      ctx.fillText(l, W - padX - lw, ny);
      ny += 88 * 0.95;
    }
    const headBottom = Math.max(padTop + 88, ny) ;
    // bottom text block: measure first so we know how much room the screenshot gets
    const maxW = W - padX * 2;
    ctx.font = "800 54px InterEmbed, sans-serif";
    const descLines = wrapText(ctx, slide.desc || "", maxW);
    ctx.font = "700 38px InterEmbed, sans-serif";
    const quoteLines = wrapText(ctx, slide.quote || "", maxW);
    const descH = descLines.length * 54 * 1.14;
    const quoteH = quoteLines.length * 38 * 1.3;
    const bottomBlockH = descH + 20 + quoteH;
    const bottomY = H - 130 - bottomBlockH;
    // screenshot area between header and bottom block, with 56px gaps
    const shotTop = headBottom + 56;
    const shotBottom = bottomY - 56;
    const shotH = Math.max(0, shotBottom - shotTop);
    // draw screenshot or placeholder
    const img = getShotImage(slide.shot);
    if (img && img.complete && img.naturalWidth) {
      const z = Math.max(1, slide.shotZoom || 1);
      const yFrac = Math.min(1, Math.max(0, slide.shotY ?? 0));
      ctx.save();
      roundRect(ctx, padX, shotTop, maxW, shotH, 12); ctx.clip();
      // cover-fit, then zoom, with vertical focus
      const ar = img.naturalWidth / img.naturalHeight;
      const boxAr = maxW / shotH;
      let dw, dh;
      if (ar > boxAr) { dh = shotH; dw = dh * ar; } else { dw = maxW; dh = dw / ar; }
      dw *= z; dh *= z;
      const dx = padX - (dw - maxW) / 2;
      const dy = shotTop - Math.max(0, dh - shotH) * yFrac;
      ctx.drawImage(img, dx, dy, dw, dh);
      ctx.restore();
    } else {
      ctx.fillStyle = "#f4f4f4";
      roundRect(ctx, padX, shotTop, maxW, shotH, 12); ctx.fill();
      ctx.strokeStyle = "rgba(15,20,25,0.18)"; ctx.lineWidth = 2;
      ctx.setLineDash([10, 8]);
      roundRect(ctx, padX, shotTop, maxW, shotH, 12); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "rgba(15,20,25,0.4)";
      ctx.font = "500 30px InterEmbed, sans-serif";
      const ph = (slide.name || "tool") + " screenshot";
      const phw = ctx.measureText(ph).width;
      ctx.fillText(ph, padX + (maxW - phw) / 2, shotTop + shotH / 2 - 18);
    }
    // bottom text
    let by = bottomY;
    ctx.fillStyle = C.text; ctx.font = "800 54px InterEmbed, sans-serif";
    for (const l of descLines) { ctx.fillText(l, padX, by); by += 54 * 1.14; }
    by += 20;
    ctx.fillStyle = C.blue; ctx.font = "700 38px InterEmbed, sans-serif";
    for (const l of quoteLines) { ctx.fillText(l, padX, by); by += 38 * 1.3; }
    drawDots(ctx, idx, total, W, H);
    return;
  }

  if (slide.type === "ed-cta") {
    drawEdHeader(ctx, avatarState);
    const maxW = W - padX * 2;
    ctx.font = "800 80px InterEmbed, sans-serif";
    const lines = wrapText(ctx, slide.closing || "", maxW);
    const blockH = lines.length * 80 * 1.1 + 40 + 72;
    let y = (H - blockH) / 2;
    ctx.fillStyle = C.text;
    for (const l of lines) { ctx.fillText(l, padX, y); y += 80 * 1.1; }
    y += 40;
    ctx.fillStyle = C.blue; ctx.font = "800 72px InterEmbed, sans-serif";
    ctx.fillText(slide.handleBlue || HANDLE, padX, y);
    drawDots(ctx, idx, total, W, H);
    return;
  }
}

function drawTwoColorBlock(ctx, blackText, blueText, x, y, maxW, size, lhMul, blackColor, blueColor) {
  // Combine into tokens with color, wrap across lines
  const tokens = [];
  blackText.split(" ").forEach(w => tokens.push({ t: w, c: blackColor }));
  blueText.split(" ").forEach(w => tokens.push({ t: w, c: blueColor }));
  const lh = size * lhMul;
  const spaceW = ctx.measureText(" ").width;
  let lineX = x, curY = y;
  let lineTokens = [];
  const flush = () => {
    let lx = x;
    for (const tk of lineTokens) {
      ctx.fillStyle = tk.c;
      ctx.fillText(tk.t, lx, curY);
      lx += ctx.measureText(tk.t).width + spaceW;
    }
    curY += lh;
    lineTokens = [];
    lineX = x;
  };
  for (const tk of tokens) {
    const wWidth = ctx.measureText(tk.t).width;
    if (lineX + wWidth > x + maxW && lineTokens.length) flush();
    lineTokens.push(tk);
    lineX += wWidth + spaceW;
  }
  if (lineTokens.length) flush();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBadge(ctx, x, y, size) {
  // scale 24x24 path -> size
  const s = size / 24;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  const p1 = new Path2D("M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91C2.88 9.33 2 10.57 2 12s.88 2.67 2.19 3.34c-.46 1.39-.2 2.9.81 3.91s2.52 1.27 3.91.81c.66 1.31 1.91 2.19 3.34 2.19s2.67-.88 3.33-2.19c1.4.46 2.91.2 3.92-.81s1.26-2.52.8-3.91C21.37 14.67 22.25 13.43 22.25 12z");
  const p2 = new Path2D("M10.54 15.27l-2.67-2.66-1.13 1.12 3.8 3.8 7.21-7.2-1.13-1.13z");
  ctx.fillStyle = "#1D9BF0";
  ctx.fill(p1);
  ctx.fillStyle = "#fff";
  ctx.fill(p2);
  ctx.restore();
}

// ============================================================
//  Preview component
// ============================================================

function SlidePreview({ slide, idx, total, avatarState, avatarTick, width = 320 }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current) drawSlide(ref.current, slide, idx, total, avatarState, 2);
  }, [slide, idx, total, avatarState, avatarTick, width]);
  return (
    <canvas
      ref={ref}
      style={{ width: width, height: width * 1.25, borderRadius: 8, display: "block", background: C.bg, boxShadow: "0 1px 4px rgba(0,0,0,0.12)" }}
    />
  );
}

// --- contentEditable text region: writes back on blur ---
function Editable({ value, onCommit, style, placeholder }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && ref.current.innerText !== (value || "")) {
      ref.current.innerText = value || "";
    }
  }, [value]);
  return (
    <span
      ref={ref}
      contentEditable
      suppressContentEditableWarning
      onBlur={e => onCommit(e.currentTarget.innerText.replace(/\n+/g, " ").trim())}
      data-ph={placeholder || ""}
      style={{ outline: "none", cursor: "text", borderRadius: 4, ...style }}
      onFocus={e => { e.currentTarget.style.background = "rgba(29,155,240,0.08)"; }}
      onBlurCapture={e => { e.currentTarget.style.background = "transparent"; }}
    />
  );
}

// Editable DOM slide that mirrors the canvas spec. Scales a 1080x1350 slide down via transform.
function EditableSlide({ slide, idx, total, avatarState, avatarTick, onChange, displayWidth = 432, readOnly = false }) {
  const W = 1080, H = 1350;
  const scale = displayWidth / W;
  const u = (k, v) => onChange && onChange({ ...slide, [k]: v });

  // avatar as a background-image cropped via the same math.
  // Always paint from src if we have one; only the crop math needs natural dims.
  const avStyle = (size = 112) => {
    const im = avatarState.img;
    if (!im || !im.src) return { background: "#d8dde2" };
    const nw = im.naturalWidth || 1, nh = im.naturalHeight || 1;
    const z = avatarState.zoom || 1;
    const natMin = Math.min(nw, nh);
    const srcSize = natMin / z;
    let sx = (nw - srcSize) * (avatarState.cx ?? 0.5);
    let sy = (nh - srcSize) * (avatarState.cy ?? 0);
    sx = Math.max(0, Math.min(sx, nw - srcSize));
    sy = Math.max(0, Math.min(sy, nh - srcSize));
    const bgW = (nw / srcSize) * size;
    const bgH = (nh / srcSize) * size;
    return {
      backgroundImage: `url(${im.src})`,
      backgroundSize: `${bgW}px ${bgH}px`,
      backgroundPosition: `${-(sx / srcSize) * size}px ${-(sy / srcSize) * size}px`,
      backgroundRepeat: "no-repeat",
    };
  };

  const dots = [];
  // T: editable region, or plain text when readOnly (used by thumbnails)
  const T = ({ value, k, style, placeholder }) =>
    readOnly
      ? <span style={style}>{value || ""}</span>
      : <Editable value={value} onCommit={v => u(k, v)} style={style} placeholder={placeholder} />;

  for (let i = 0; i < total; i++) {
    dots.push(
      <div key={i} style={{
        width: i === idx ? 32 : 12, height: 12, borderRadius: i === idx ? 8 : "50%",
        background: i === idx ? C.blue : C.inactiveDot,
      }} />
    );
  }

  const isEd = slide.type && slide.type.indexOf("ed-") === 0;

  if (slide.type === "card") {
    return (
      <div style={{ width: displayWidth, height: H * scale, borderRadius: 8, overflow: "hidden", boxShadow: "0 2px 10px rgba(0,0,0,0.12)" }}>
        <div style={{
          width: W, height: H, transform: `scale(${scale})`, transformOrigin: "top left",
          background: "#ECEEF0", position: "relative", boxSizing: "border-box",
          display: "flex", alignItems: "center", justifyContent: "center",
          fontFamily: "InterEmbed, sans-serif",
        }}>
          <div style={{ width: 840, background: "#FFFFFF", borderRadius: 36, padding: 64, boxSizing: "border-box", boxShadow: "0 18px 60px rgba(15,20,25,0.10)" }}>
            <div style={{ display: "flex", alignItems: "center", marginBottom: 40 }}>
              <div style={{ width: 96, height: 96, borderRadius: "50%", border: `2px solid ${C.avatarBorder}`, flexShrink: 0, ...avStyle(96) }} />
              <div style={{ marginLeft: 20, display: "flex", flexDirection: "column", justifyContent: "center" }}>
                <div style={{ display: "flex", alignItems: "center", fontWeight: 800, fontSize: 38, color: C.text, lineHeight: 1.1 }}>
                  {NAME}
                  <span style={{ marginLeft: 9, display: "inline-flex" }} dangerouslySetInnerHTML={{ __html: VERIFIED_SVG(38) }} />
                </div>
                <div style={{ fontWeight: 500, fontSize: 32, color: C.handle, marginTop: 2 }}>{HANDLE}</div>
              </div>
            </div>
            <div style={{ fontSize: 52, fontWeight: 500, color: C.text, lineHeight: 1.4 }}>
              <T value={slide.text} k="text" placeholder="Your statement" />
            </div>
          </div>
        </div>
      </div>
    );
  }

  if (isEd) {
    return (
      <div style={{ width: displayWidth, height: H * scale, borderRadius: 8, overflow: "hidden", boxShadow: "0 2px 10px rgba(0,0,0,0.12)" }}>
        <div style={{
          width: W, height: H, transform: `scale(${scale})`, transformOrigin: "top left",
          background: C.bg, position: "relative", boxSizing: "border-box",
          padding: slide.type === "ed-tool" ? "84px 82px 130px" : "72px 82px",
          display: "flex", flexDirection: "column", fontFamily: "InterEmbed, sans-serif",
        }}>
          {/* header only on cover + cta */}

function AvatarCrop({ avatarState, setAvatarState, onClose }) {
  const canvasRef = useRef(null);
  const dragRef = useRef(null);
  const VIEW = 360;

  const redraw = useCallback(() => {
    const cv = canvasRef.current;
    if (!cv) return;
    const ctx = cv.getContext("2d");
    cv.width = VIEW; cv.height = VIEW;
    ctx.clearRect(0, 0, VIEW, VIEW);
    const im = avatarState.img;
    if (im && im.complete) {
      const z = avatarState.zoom;
      const natMin = Math.min(im.naturalWidth, im.naturalHeight);
      const srcSize = natMin / z;
      let sx = (im.naturalWidth - srcSize) * avatarState.cx;
      let sy = (im.naturalHeight - srcSize) * avatarState.cy;
      sx = Math.max(0, Math.min(sx, im.naturalWidth - srcSize));
      sy = Math.max(0, Math.min(sy, im.naturalHeight - srcSize));
      ctx.drawImage(im, sx, sy, srcSize, srcSize, 0, 0, VIEW, VIEW);
    }
    // circle mask overlay
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.beginPath();
    ctx.rect(0, 0, VIEW, VIEW);
    ctx.arc(VIEW / 2, VIEW / 2, VIEW / 2, 0, Math.PI * 2, true);
    ctx.fill("evenodd");
    ctx.restore();
    ctx.beginPath();
    ctx.arc(VIEW / 2, VIEW / 2, VIEW / 2 - 1, 0, Math.PI * 2);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.stroke();
  }, [avatarState]);

  useEffect(() => { redraw(); }, [redraw]);

  const onDown = (e) => {
    dragRef.current = { x: e.clientX, y: e.clientY, cx: avatarState.cx, cy: avatarState.cy };
  };
  const onMove = (e) => {
    if (!dragRef.current) return;
    const dx = (e.clientX - dragRef.current.x) / VIEW;
    const dy = (e.clientY - dragRef.current.y) / VIEW;
    setAvatarState(s => ({
      ...s,
      cx: Math.max(0, Math.min(1, dragRef.current.cx - dx)),
      cy: Math.max(0, Math.min(1, dragRef.current.cy - dy)),
    }));
  };
  const onUp = () => { dragRef.current = null; };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100 }}
      onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp}>
      <div style={{ background: "#fff", borderRadius: 16, padding: 28, width: 440, fontFamily: "InterEmbed, sans-serif" }}>
        <div style={{ fontWeight: 800, fontSize: 18, marginBottom: 4, color: "#0f1419" }}>Position avatar</div>
        <div style={{ fontSize: 13, color: "#5b7083", marginBottom: 18 }}>Drag the photo to reposition. Use the slider to zoom.</div>
        <canvas ref={canvasRef} onMouseDown={onDown}
          style={{ width: VIEW, height: VIEW, borderRadius: 12, cursor: "grab", background: "#eee", display: "block", margin: "0 auto" }} />
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 18 }}>
          <span style={{ fontSize: 13, color: "#5b7083" }}>Zoom</span>
          <input type="range" min="1" max="3" step="0.01" value={avatarState.zoom}
            onChange={e => setAvatarState(s => ({ ...s, zoom: parseFloat(e.target.value) }))}
            style={{ flex: 1 }} />
        </div>
        <div style={{ display: "flex", gap: 10, marginTop: 22 }}>
          <button onClick={() => setAvatarState(s => ({ ...s, zoom: 1, cx: 0.5, cy: 0 }))}
            style={btnGhost}>Reset</button>
          <button onClick={onClose} style={btnPrimary}>Done</button>
        </div>
      </div>
    </div>
  );
}

const BRIEF = `You write Instagram carousel copy for Suleman Alhabashi, a marketing consultant. Rules, follow exactly:
- Plain everyday language. No jargon (no SEO, funnel, CTR, engagement-rate talk written as jargon).
- Never use em dashes. Use periods, commas or colons.
- No clickbait words like "steal".
- No Arabic names or brands in examples.
- Audience is mixed, many are not marketers. Frame from a human / consumer angle: "here is something interesting that happened", not "advice for your business".
- Real brand stories with surprising or counterintuitive outcomes. Real brand names in text are fine.
- Max about 45 words of body text per content slide. Two short paragraphs max per content slide.
- Each content slide ends with one short blue key phrase (the punchline of that slide).
- Cover headline: a black setup part and a blue surprising part.
- CTA slide: a strong closing statement, no "comment below" calls to action.`;

async function callClaude(messages, system) {
  const key = localStorage.getItem("anthropic_api_key") || "";
  if (!key) throw new Error("NO_KEY");
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1500,
      system,
      messages,
    }),
  });
  if (!res.ok) {
    const t = await res.text();
    throw new Error("API_" + res.status + ": " + t.slice(0, 200));
  }
  const data = await res.json();
  return data.content.filter(b => b.type === "text").map(b => b.text).join("\n");
}

function CarouselGenerator() {
  useFont();
  // --- history-tracked slides ---
  const [history, setHistory] = useState([STARTER_SLIDES]);
  const [histIndex, setHistIndex] = useState(0);
  const histIndexRef = useRef(0);
  useEffect(() => { histIndexRef.current = histIndex; }, [histIndex]);
  const slides = history[histIndex];

  const MAX_HIST = 80;
  // setSlides: accepts a value or updater, pushes a new history entry,
  // discarding any redo tail and capping total length.
  const setSlides = useCallback((updater) => {
    setHistory(h => {
      const idx = histIndexRef.current;
      const cur = h[idx];
      const next = typeof updater === "function" ? updater(cur) : updater;
      if (next === cur) return h;
      let trimmed = h.slice(0, idx + 1);
      trimmed.push(next);
      if (trimmed.length > MAX_HIST) trimmed = trimmed.slice(trimmed.length - MAX_HIST);
      const newIdx = trimmed.length - 1;
      histIndexRef.current = newIdx;
      setHistIndex(newIdx);
      return trimmed;
    });
  }, []);

  const canUndo = histIndex > 0;
  const canRedo = histIndex < history.length - 1;
  const undo = () => setHistIndex(i => Math.max(0, i - 1));
  const redo = () => setHistIndex(i => Math.min(history.length - 1, i + 1));

  const [selected, setSelected] = useState(0);
  const [template, setTemplate] = useState("tweet"); // "tweet" | "editorial"
  const [topicSeed, setTopicSeed] = useState("");
  const [topicIdeas, setTopicIdeas] = useState([]);
  const [loadingTopics, setLoadingTopics] = useState(false);
  const [loadingCopy, setLoadingCopy] = useState(false);
  const [showCrop, setShowCrop] = useState(false);
  const [exporting, setExporting] = useState(false);
  const [showFields, setShowFields] = useState(false);
  const [err, setErr] = useState("");
  const [showSettings, setShowSettings] = useState(false);
  const [apiKey, setApiKey] = useState("");
  const [keyPresent, setKeyPresent] = useState(false);
  const [shotKey, setShotKey] = useState("");
  const [fetchingShot, setFetchingShot] = useState(false);
  useEffect(() => {
    const k = localStorage.getItem("anthropic_api_key") || "";
    setApiKey(k);
    setKeyPresent(!!k);
    setShotKey(localStorage.getItem("screenshot_api_key") || "");
  }, []);
  const saveKey = () => {
    localStorage.setItem("anthropic_api_key", apiKey.trim());
    localStorage.setItem("screenshot_api_key", shotKey.trim());
    setKeyPresent(!!apiKey.trim());
    setShowSettings(false);
    setErr("");
  };

  const defaultImg = useRef(null);
  const [avatarState, setAvatarState] = useState({ img: null, zoom: 1, cx: 0.5, cy: 0 });
  const [avatarTick, setAvatarTick] = useState(0);

  // keyboard shortcuts
  useEffect(() => {
    const onKey = (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (!mod) return;
      if (e.key === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
      else if ((e.key === "z" && e.shiftKey) || e.key === "y") { e.preventDefault(); redo(); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [canUndo, canRedo]);

  // load default avatar
  useEffect(() => {
    const im = new Image();
    im.onload = async () => {
      try { if (im.decode) await im.decode(); } catch (e) {}
      defaultImg.current = im;
      setAvatarState(s => ({ ...s, img: im }));
      setAvatarTick(t => t + 1);
    };
    im.src = DEFAULT_AVATAR;
  }, []);

  const total = slides.length;
  const updateSlide = (i, ns) => setSlides(s => s.map((x, k) => k === i ? ns : x));

  const onUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = async () => {
        try { if (im.decode) await im.decode(); } catch (e) {}
        setAvatarState({ img: im, zoom: 1, cx: 0.5, cy: 0 });
        setAvatarTick(t => t + 1);
        setShowCrop(true);
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  };

  const genTopics = async () => {
    setErr(""); setLoadingTopics(true); setTopicIdeas([]);
    try {
      let prompt;
      if (template === "editorial") {
        const seed = topicSeed.trim() ? `Niche or theme: ${topicSeed.trim()}.` : "Tools and websites useful to designers, marketers, or creators.";
        prompt = `${seed}\nGive me 8 "tool roundup" carousel topic ideas. Each one line, like "6 must-have inspiration sites for designers" or "5 free tools that replace expensive software". Return ONLY a JSON array of 8 strings, no preamble, no markdown.`;
      } else if (template === "card") {
        const seed = topicSeed.trim() ? `Theme to explore: ${topicSeed.trim()}.` : "Marketing, branding, or consumer psychology.";
        prompt = `${seed}\nGive me 8 short single-post statement ideas: each a sharp, thought-provoking observation a marketing consultant would post as one standalone card. Each max 35 words. Return ONLY a JSON array of 8 strings, no preamble, no markdown.`;
      } else {
        const seed = topicSeed.trim() ? `Theme to explore: ${topicSeed.trim()}.` : "Any marketing or consumer-psychology theme.";
        prompt = `${seed}\nGive me 8 carousel topic ideas. Each one line, in the format "[Brand] did [unexpected thing]. [short result]." or a counterintuitive consumer-behaviour hook. Return ONLY a JSON array of 8 strings, no preamble, no markdown.`;
      }
      const out = await callClaude([{ role: "user", content: prompt }], BRIEF);
      const clean = out.replace(/```json|```/g, "").trim();
      setTopicIdeas(JSON.parse(clean));
    } catch (e) {
      if (String(e.message).includes("NO_KEY")) { setErr("Add your Anthropic API key first (top right)."); setShowSettings(true); }
      else setErr("Topic generation failed: " + e.message);
    } finally { setLoadingTopics(false); }
  };

  const genCopy = async (topic) => {
    setErr(""); setLoadingCopy(true);
    try {
      let prompt;
      if (template === "editorial") {
        prompt = `Topic: ${topic}\nWrite a "tool roundup" carousel. Slide 1 is the cover. Then 6 tool slides. Last slide is the CTA.\nFor each tool, give a real, well-known website with its correct https URL, a short "what it is" line (max 10 words), and a one-line quote (max 16 words).\nReturn ONLY valid JSON, no markdown, in this exact shape:\n{"slides":[{"type":"ed-cover","lead":"<intro line>","titleBlack":"<setup words>","titleBlue":"<punchy end words>"},{"type":"ed-tool","num":"01","name":"<TOOL NAME>","url":"https://...","desc":"<what it is>","quote":"<one-line quote>","shot":""}, ... 6 ed-tool slides numbered 01 to 06 ... ,{"type":"ed-cta","closing":"<closing statement>","handleBlue":"@sulemanalhabashi"}]}`;
      } else if (template === "card") {
        prompt = `Topic: ${topic}\nWrite ONE standalone statement post for a single card. Conversational, sharp, makes the reader think. 25 to 45 words. Plain language, no em dashes, no hashtags.\nReturn ONLY valid JSON, no markdown: {"slides":[{"type":"card","text":"<the statement>"}]}`;
      } else {
        prompt = `Topic: ${topic}\nWrite a full 8-slide carousel. Slide 1 is the cover. Slides 2 to 7 are content. Slide 8 is the CTA.\nReturn ONLY valid JSON, no markdown, in this exact shape:\n{"slides":[{"type":"cover","headlineBlack":"...","headlineBlue":"..."},{"type":"content","headline":"...","p1":"...","p2":"...","blue":"..."}, ... 6 content slides total ... ,{"type":"cta","closing":"...","handleBlue":"@sulemanalhabashi"}]}`;
      }
      const out = await callClaude([{ role: "user", content: prompt }], BRIEF);
      const clean = out.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(clean);
      if (parsed.slides && parsed.slides.length) {
        setSlides(parsed.slides);
        setSelected(0);
        // auto-fetch website screenshots for editorial carousels
        if (template === "editorial") fetchAllShots(parsed.slides);
      }
    } catch (e) {
      if (String(e.message).includes("NO_KEY")) { setErr("Add your Anthropic API key first (top right)."); setShowSettings(true); }
      else setErr("Copy generation failed: " + e.message);
    } finally { setLoadingCopy(false); }
  };

  // --- Screenshot fetching ---
  const shotForUrl = async (key, url) => {
    const api = "https://api.screenshotone.com/take?" + new URLSearchParams({
      access_key: key,
      url: url,
      viewport_width: "1280",
      viewport_height: "1000",
      device_scale_factor: "2",
      format: "jpg",
      image_quality: "82",
      block_ads: "true",
      block_cookie_banners: "true",
      cache: "true",
    }).toString();
    const res = await fetch(api);
    if (!res.ok) {
      let detail = "";
      try { detail = (await res.text()).slice(0, 120); } catch (e) {}
      throw new Error("API " + res.status + (detail ? " " + detail : ""));
    }
    const blob = await res.blob();
    const dataUrl = await new Promise((resolve) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.readAsDataURL(blob);
    });
    await new Promise((resolve) => {
      const im = new Image();
      im.onload = () => { SHOT_CACHE[dataUrl] = im; resolve(); };
      im.onerror = resolve;
      im.src = dataUrl;
    });
    return dataUrl;
  };

  // Fetch one slide's screenshot (button on the slide).
  const fetchShot = async (i) => {
    setErr("");
    const key = (localStorage.getItem("screenshot_api_key") || "").trim();
    if (!key) { setErr("Add a screenshot API key first (top right, Settings)."); setShowSettings(true); return; }
    const url = (slides[i].url || "").trim();
    if (!url) { setErr("Add the website URL for this tool first."); return; }
    setFetchingShot(true);
    try {
      const dataUrl = await shotForUrl(key, url);
      setSlides(s => s.map((sl, k) => k === i ? { ...sl, shot: dataUrl } : sl));
    } catch (e) {
      setErr("Screenshot fetch failed: " + e.message);
    } finally { setFetchingShot(false); }
  };

  // Fetch ALL tool slides' screenshots, updating each as it arrives.
  const fetchAllShots = async (slideArr) => {
    const key = (localStorage.getItem("screenshot_api_key") || "").trim();
    const list = slideArr || slides;
    const targets = list.map((s, i) => ({ s, i })).filter(x => x.s.type === "ed-tool" && x.s.url && !x.s.shot);
    if (!targets.length) return;
    if (!key) { setErr("Add a screenshot API key in Settings to auto-fetch website screenshots."); return; }
    setFetchingShot(true);
    let failed = 0;
    for (const t of targets) {
      try {
        const dataUrl = await shotForUrl(key, t.s.url.trim());
        setSlides(cur => cur.map((sl, k) => k === t.i ? { ...sl, shot: dataUrl } : sl));
      } catch (e) { failed++; }
    }
    setFetchingShot(false);
    if (failed) setErr(failed + " screenshot(s) failed to fetch. Select those slides and tap Fetch to retry, or check the URL.");
  };

  // switch template: load that template's starter set as a fresh history
  const switchTemplate = (t) => {
    if (t === template) return;
    setTemplate(t);
    setSelected(0);
    setSlides(t === "editorial" ? STARTER_EDITORIAL : t === "card" ? STARTER_CARD : STARTER_SLIDES);
  };

  const ensureAvatarReady = async () => {
    const im = avatarState.img;
    if (im && im.src && !im.naturalWidth && im.decode) {
      try { await im.decode(); } catch (e) {}
    }
  };

  const exportAll = async () => {
    setExporting(true);
    setErr("");
    try {
      await ensureAvatarReady();
      const zip = new window.JSZip();
      for (let i = 0; i < slides.length; i++) {
        const cv = document.createElement("canvas");
        drawSlide(cv, slides[i], i, total, avatarState, 2);
        const blob = await new Promise(res => cv.toBlob(res, "image/png"));
        zip.file(`slide_${String(i + 1).padStart(2, "0")}.png`, blob);
      }
      const content = await zip.generateAsync({ type: "blob" });
      const url = URL.createObjectURL(content);
      const a = document.createElement("a");
      a.href = url;
      a.download = "carousel.zip";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    } catch (e) {
      setErr("ZIP export failed. Use 'Download this slide' on each slide instead.");
    } finally { setExporting(false); }
  };

  const exportOne = async (i) => {
    await ensureAvatarReady();
    const cv = document.createElement("canvas");
    drawSlide(cv, slides[i], i, total, avatarState, 2);
    cv.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `slide_${String(i + 1).padStart(2, "0")}.png`; a.click();
      URL.revokeObjectURL(url);
    }, "image/png");
  };

  const addSlide = () => {
    setSlides(s => {
      const copy = [...s];
      if (template === "card") {
        copy.push({ type: "card", text: "New statement" });
        return copy;
      }
      const insertAt = copy.length - 1; // before CTA
      if (template === "editorial") {
        const n = String(copy.filter(x => x.type === "ed-tool").length + 1).padStart(2, "0");
        copy.splice(insertAt, 0, { type: "ed-tool", num: n, name: "NEW TOOL", url: "", desc: "", quote: "", shot: "" });
      } else {
        copy.splice(insertAt, 0, { type: "content", headline: "New slide", p1: "", p2: "", blue: "" });
      }
      return copy;
    });
  };
  const removeSlide = (i) => {
    const t = slides[i].type;
    if (t === "cover" || t === "cta" || t === "ed-cover" || t === "ed-cta") return;
    if (t === "card" && slides.length <= 1) return;
    setSlides(s => s.filter((_, k) => k !== i));
    setSelected(0);
  };

  return (
    <div style={{ fontFamily: "InterEmbed, sans-serif", background: "#fbfbfc", minHeight: "100vh", color: "#0f1419" }}>
      {/* Header */}
      <div style={{ borderBottom: "1px solid #e6e9ec", padding: "16px 24px", display: "flex", alignItems: "center", justifyContent: "space-between", background: "#fff", position: "sticky", top: 0, zIndex: 10 }}>
        <div>
          <div style={{ fontWeight: 800, fontSize: 17 }}>Carousel Generator <span style={{ fontWeight: 600, fontSize: 11, color: "#8b9198", verticalAlign: "middle" }}>v3.1</span></div>
          <div style={{ fontSize: 12, color: "#8b9198" }}>{NAME} · {HANDLE}</div>
        </div>
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          <div style={{ display: "flex", gap: 4, marginRight: 4 }}>
            <button onClick={undo} disabled={!canUndo} title="Undo (Cmd/Ctrl+Z)"
              style={{ ...iconBtn, opacity: canUndo ? 1 : 0.35, cursor: canUndo ? "pointer" : "default" }}>↶</button>
            <button onClick={redo} disabled={!canRedo} title="Redo (Cmd/Ctrl+Shift+Z)"
              style={{ ...iconBtn, opacity: canRedo ? 1 : 0.35, cursor: canRedo ? "pointer" : "default" }}>↷</button>
          </div>
          <label style={{ ...btnGhost, flex: "none", display: "inline-flex", alignItems: "center" }}>
            Upload avatar
            <input type="file" accept="image/*" onChange={onUpload} style={{ display: "none" }} />
          </label>
          <button style={{ ...btnGhost, flex: "none" }} onClick={() => setShowCrop(true)}>Position avatar</button>
          <button style={{ ...btnGhost, flex: "none" }} onClick={() => setShowSettings(true)}>
            {keyPresent ? "API key ✓" : "Set API key"}
          </button>
          <button style={{ ...btnPrimary, flex: "none" }} onClick={exportAll} disabled={exporting}>
            {exporting ? "Exporting…" : "Download all (ZIP)"}
          </button>
        </div>
      </div>

      {err && <div style={{ background: "#ffe9e9", color: "#b00020", padding: "8px 24px", fontSize: 13 }}>{err}</div>}

      <div style={{ display: "grid", gridTemplateColumns: "330px 1fr 360px", gap: 0, height: "calc(100vh - 66px)" }}>
        {/* LEFT: AI panel + slide list */}
        <div style={{ borderRight: "1px solid #e6e9ec", padding: 20, overflowY: "auto", background: "#fff" }}>
          <div style={{ fontWeight: 800, fontSize: 13, textTransform: "uppercase", letterSpacing: "0.05em", color: "#8b9198", marginBottom: 10 }}>Template</div>
          <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
            <button onClick={() => switchTemplate("tweet")}
              style={{ ...(template === "tweet" ? btnPrimary : btnGhost), flex: 1 }}>Tweet style</button>
            <button onClick={() => switchTemplate("editorial")}
              style={{ ...(template === "editorial" ? btnPrimary : btnGhost), flex: 1 }}>Tool roundup</button>
            <button onClick={() => switchTemplate("card")}
              style={{ ...(template === "card" ? btnPrimary : btnGhost), flex: 1 }}>Card</button>
          </div>
          <div style={{ fontWeight: 800, fontSize: 13, textTransform: "uppercase", letterSpacing: "0.05em", color: "#8b9198", marginBottom: 10 }}>1. Generate</div>
          <input value={topicSeed} onChange={e => setTopicSeed(e.target.value)} placeholder={template === "editorial" ? "Optional niche (e.g. design tools)" : "Optional theme (e.g. pricing tricks)"}
            style={{ ...inputStyle, marginBottom: 8 }} />
          <button style={{ ...btnBlue, width: "100%", marginBottom: 14 }} onClick={genTopics} disabled={loadingTopics}>
            {loadingTopics ? "Thinking…" : "Generate topic ideas"}
          </button>

          {topicIdeas.length > 0 && (
            <div style={{ marginBottom: 18 }}>
              {topicIdeas.map((t, i) => (
                <div key={i} onClick={() => !loadingCopy && genCopy(t)}
                  style={{ fontSize: 13, lineHeight: 1.4, padding: "9px 11px", border: "1px solid #e6e9ec", borderRadius: 8, marginBottom: 6, cursor: "pointer", background: "#fafbfc" }}>
                  {t}
                </div>
              ))}
              <div style={{ fontSize: 11, color: "#8b9198", marginTop: 4 }}>Tap a topic to write the full carousel.</div>
            </div>
          )}
          {loadingCopy && <div style={{ fontSize: 13, color: C.blue, marginBottom: 14 }}>Writing slides…</div>}

          <div style={{ fontWeight: 800, fontSize: 13, textTransform: "uppercase", letterSpacing: "0.05em", color: "#8b9198", margin: "8px 0 10px" }}>2. Slides</div>
          {slides.map((s, i) => {
            const label = s.type === "cover" || s.type === "ed-cover" ? "Cover"
              : s.type === "cta" || s.type === "ed-cta" ? "CTA"
              : s.type === "ed-tool" ? ((s.num ? s.num + ". " : "") + (s.name || "Tool")).slice(0, 22)
              : s.type === "card" ? (s.text || "Card").slice(0, 22)
              : (s.headline || "Content").slice(0, 22);
            const removable = s.type === "content" || s.type === "ed-tool" || (s.type === "card" && slides.length > 1);
            return (
              <div key={i} onClick={() => setSelected(i)}
                style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 10px", borderRadius: 8, marginBottom: 5, cursor: "pointer", background: selected === i ? "#eef6fe" : "transparent", border: selected === i ? `1px solid ${C.blue}` : "1px solid transparent" }}>
                <span style={{ fontSize: 13, fontWeight: selected === i ? 700 : 500 }}>
                  {i + 1}. {label}
                </span>
                {removable && (
                  <span onClick={(e) => { e.stopPropagation(); removeSlide(i); }} style={{ color: "#c0c4c8", fontSize: 16, fontWeight: 700 }}>×</span>
                )}
              </div>
            );
          })}
          <button style={{ ...btnGhost, width: "100%", marginTop: 6 }} onClick={addSlide}>{template === "editorial" ? "+ Add tool slide" : template === "card" ? "+ Add card" : "+ Add content slide"}</button>
          {template === "editorial" && (
            <button style={{ ...btnBlue, width: "100%", marginTop: 8 }} onClick={() => fetchAllShots()} disabled={fetchingShot}>
              {fetchingShot ? "Fetching screenshots…" : "Fetch all screenshots"}
            </button>
          )}
        </div>

        {/* CENTER: edit directly on the slide */}
        <div style={{ padding: 24, overflowY: "auto" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, maxWidth: 432 }}>
            <div style={{ fontWeight: 800, fontSize: 13, textTransform: "uppercase", letterSpacing: "0.05em", color: "#8b9198" }}>Edit slide {selected + 1} — click any text</div>
          </div>
          <EditableSlide slide={slides[selected]} idx={selected} total={total} avatarState={avatarState} avatarTick={avatarTick} onChange={ns => updateSlide(selected, ns)} displayWidth={432} />
          <div style={{ display: "flex", gap: 10, marginTop: 16, maxWidth: 432 }}>
            <button style={btnGhost} onClick={() => exportOne(selected)}>Download this slide</button>
            <button style={btnGhost} onClick={() => setShowFields(f => !f)}>{showFields ? "Hide fields" : "Edit as fields"}</button>
          </div>
          {slides[selected].type === "ed-tool" && (
            <button style={{ ...btnBlue, width: "100%", maxWidth: 432, marginTop: 10 }} onClick={() => fetchShot(selected)} disabled={fetchingShot}>
              {fetchingShot ? "Fetching screenshot…" : (slides[selected].shot ? "Re-fetch website screenshot" : "Fetch website screenshot")}
            </button>
          )}
          {showFields && (
            <div style={{ marginTop: 16, maxWidth: 432, padding: 16, border: "1px solid #e6e9ec", borderRadius: 10, background: "#fff" }}>
              <SlideEditor slide={slides[selected]} index={selected} onChange={ns => updateSlide(selected, ns)} onFetchShot={fetchShot} fetchingShot={fetchingShot} />
            </div>
          )}
        </div>

        {/* RIGHT: all slides thumbnails */}
        <div style={{ borderLeft: "1px solid #e6e9ec", padding: 20, overflowY: "auto", background: "#fff" }}>
          <div style={{ fontWeight: 800, fontSize: 13, textTransform: "uppercase", letterSpacing: "0.05em", color: "#8b9198", marginBottom: 12 }}>All slides</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            {slides.map((s, i) => (
              <div key={i} onClick={() => setSelected(i)} style={{ cursor: "pointer", outline: selected === i ? `2px solid ${C.blue}` : "none", borderRadius: 8, position: "relative" }}>
                <div style={{ pointerEvents: "none" }}>
                  <EditableSlide slide={s} idx={i} total={total} avatarState={avatarState} avatarTick={avatarTick} displayWidth={150} readOnly />
                </div>
                <div style={{ position: "absolute", top: 4, left: 6, fontSize: 10, fontWeight: 700, color: "#8b9198", background: "rgba(255,255,255,0.7)", borderRadius: 4, padding: "1px 5px" }}>{i + 1}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {showCrop && <AvatarCrop avatarState={avatarState} setAvatarState={setAvatarState} onClose={() => setShowCrop(false)} />}
      {showSettings && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100 }}>
          <div style={{ background: "#fff", borderRadius: 16, padding: 28, width: 460, fontFamily: "InterEmbed, sans-serif" }}>
            <div style={{ fontWeight: 800, fontSize: 18, marginBottom: 4, color: "#0f1419" }}>Anthropic API key</div>
            <div style={{ fontSize: 13, color: "#5b7083", marginBottom: 16, lineHeight: 1.5 }}>
              Needed for the AI generate buttons. Stored only in this browser (localStorage), never uploaded or shared. Get one at console.anthropic.com under API Keys.
            </div>
            <input
              type="password"
              value={apiKey}
              onChange={e => setApiKey(e.target.value)}
              placeholder="sk-ant-..."
              style={{ ...inputStyle, marginBottom: 8, fontFamily: "monospace" }}
            />
            <div style={{ fontSize: 12, color: "#8b9198", marginBottom: 18 }}>
              Editing and PNG export work without a key. Only topic and copy generation need it.
            </div>
            <div style={{ fontWeight: 800, fontSize: 18, marginBottom: 4, color: "#0f1419" }}>Screenshot API key</div>
            <div style={{ fontSize: 13, color: "#5b7083", marginBottom: 16, lineHeight: 1.5 }}>
              Optional. Only used by the Tool roundup template to auto-fetch website screenshots. Get a free key at screenshotone.com (free tier available). Stored only in this browser.
            </div>
            <input
              type="password"
              value={shotKey}
              onChange={e => setShotKey(e.target.value)}
              placeholder="screenshot access key"
              style={{ ...inputStyle, marginBottom: 18, fontFamily: "monospace" }}
            />
            <div style={{ display: "flex", gap: 10 }}>
              <button style={btnGhost} onClick={() => { localStorage.removeItem("anthropic_api_key"); localStorage.removeItem("screenshot_api_key"); setApiKey(""); setShotKey(""); setKeyPresent(false); setShowSettings(false); }}>Clear</button>
              <button style={btnPrimary} onClick={saveKey}>Save</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<CarouselGenerator />);
</script>
</body>
</html>
